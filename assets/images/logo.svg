<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="320" height="64" overflow="visible">
  <!-- Wealth Bridge Iconic Mark -->
  <g transform="translate(14, 6)">
    <!-- Base Foundation Line -->
    <path d="M 4 48 L 48 48" stroke="#B69A62" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Left Pillar -->
    <path d="M 12 48 L 12 22" stroke="#14263D" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Pillar -->
    <path d="M 40 48 L 40 22" stroke="#14263D" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Central Ascension Pillar / Keystone -->
    <path d="M 26 48 L 26 10" stroke="#B69A62" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Elegant Parabolic Bridge Arch -->
    <path d="M 4 38 Q 26 14 48 38" stroke="#14263D" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    
    <!-- Upper Diamond / Compass Keystone -->
    <polygon points="26,4 31,10 26,16 21,10" fill="#B69A62"/>
    
    <!-- Subtle Golden Bridge Suspension Cables -->
    <path d="M 19 28 L 19 48" stroke="#B69A62" stroke-width="1.2" stroke-dasharray="1 2"/>
    <path d="M 33 28 L 33 48" stroke="#B69A62" stroke-width="1.2" stroke-dasharray="1 2"/>
  </g>

  <!-- Typography -->
  <text x="76" y="32" font-family="'Playfair Display', 'Cinzel', Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="2.4" fill="#14263D">WEALTH BRIDGE</text>
  <text x="77" y="48" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.8" fill="#B69A62">INVESTMENT ADVISORY</text>
</svg>
